dataset:
  name: nguyen__Nguyen-9
  description: This is an abstract symbolic regression problem.
  splits:
    train:
      file: train.csv
      samples: 16
      ratio: 8
      nmse: 0
    valid:
      file: valid.csv
      samples: 2
      ratio: 1
      nmse: 0
    id_test:
      file: id_test.csv
      samples: 2
      ratio: 1
      nmse: 0
    ood_test:
      file: ood_test.csv
      samples: 200
      ratio: 100
      nmse: 0
  ground_truth_formula:
    file: formula.py
  features:
  - name: x1
    type: continuous
    description: Independent variables (anonymized)
    train_range:
    - 0.07879841618396055
    - 0.9209427422077568
    ood_range:
    - 0.004060937260314423
    - 1.0998594741923864
  - name: x2
    type: continuous
    description: Independent variables (anonymized)
    train_range:
    - 0.07225657556150356
    - 0.9831237709939898
    ood_range:
    - 0.014459363459688457
    - 1.0980896250169536
  target:
    name: target
    type: continuous
    description: Dependent variable (target)
    train_range:
    - 0.3800563273710924
    - 1.5973544165353837
    ood_range:
    - 0.8530787325882107
    - 1.758246906444834
  license: unknown
  resources:
  - https://github.com/dso-org/deep-symbolic-optimization
  - https://raw.githubusercontent.com/dso-org/deep-symbolic-optimization/master/dso/dso/dso/task/regression/benchmarks.csv
  - 'Benchmark family: nguyen'
  - 'Equation: sin(x1)+sin(pow(x2,2))'
  - 'Train specification: {''all'': {''U'': [0, 1, 20]}}'
  - OOD split was synthesized from the training domain by sampling at least one feature
    outside the train range and evaluating the ground-truth formula.
