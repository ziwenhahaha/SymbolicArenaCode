dataset:
  name: srsd__srsd-feynman_medium_dummy__feynman-ii.34.2a
  description: Calculate the Electric Current given Electric charge, Velocity, Radius
  splits:
    train:
      file: train.csv
      samples: 8000
      ratio: 8
      nmse: 3.0233359e-15
    valid:
      file: valid.csv
      samples: 1000
      ratio: 1
      nmse: 3.1992159e-15
    id_test:
      file: id_test.csv
      samples: 1000
      ratio: 1
      nmse: 1.6414818e-15
    ood_test:
      file: ood_test.csv
      samples: 1000
      ratio: 1
      nmse: 3.3875279e-29
  ground_truth_formula:
    file: formula.py
  features:
    - name: x0
      type: continuous
      train_range: [-9.978058724356061e-30, 9.99589313656764e-30]
      ood_range: [[-1.0976756e-29, -9.9780587e-30], [9.9958931e-30, 1.0994591e-29]]
      description: meaningless
    - name: x1
      type: continuous
      train_range: [-9.996635741416071e-10, 9.99891169861655e-10]
      ood_range: [[-1.0996413e-09, -9.9966357e-10], [9.9989117e-10, 1.0998689e-09]]
      description: q, Electric charge
    - name: x2
      type: continuous
      train_range: [-9.981044114381384e-27, 9.964441057516812e-27]
      ood_range: [[-1.0978318e-26, -9.9810441e-27], [9.9644411e-27, 1.0961715e-26]]
      description: meaningless
    - name: x3
      type: continuous
      train_range: [-9998451.0, 9993635.0]
      ood_range: [[-10998055, -9998451], [9993635, 10993239]]
      description: v, Velocity
    - name: x4
      type: continuous
      train_range: [1.0000679971644553e-11, 9.99048066496755e-10]
      ood_range: [[7.9442278e-12, 1.000068e-11], [9.9904807e-10, 1.2576628e-09]]
      description: r, Radius

  target:
    name: y
    type: continuous
    train_range: [-102542496.0, 85652288.0]
    ood_range: 
    description: I, Electric Current

