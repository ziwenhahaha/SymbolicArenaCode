dataset:
  name: srsd__srsd-feynman_medium__feynman-i.13.12
  description: Calculate the Potential energy given Gravitational constant, Mass (The Earth), Mass, Distance
  splits:
    train:
      file: train.csv
      samples: 8000
      ratio: 8
      nmse: 0
    valid:
      file: valid.csv
      samples: 1000
      ratio: 1
      nmse: 0
    id_test:
      file: id_test.csv
      samples: 1000
      ratio: 1
      nmse: 0
    ood_test:
      file: ood_test.csv
      samples: 1000
      ratio: 1
      nmse: 1.3791977e-29
  ground_truth_formula:
    file: formula.py
  features:
    - name: x0
      type: continuous
      train_range: [0.010002161139653735, 0.9998967720481229]
      ood_range: [[0.0079451259, 0.010002161], [0.99989677, 1.2587754]]
      description: G, Gravitational constant
    - name: x1
      type: continuous
      train_range: [0.010035805649715984, 0.999638784488144]
      ood_range: [[0.0079732926, 0.010035806], [0.99963878, 1.2582231]]
      description: m_1, Mass (The Earth)
    - name: x2
      type: continuous
      train_range: [0.010005059770952918, 0.9999000227135209]
      ood_range: [[0.0079475422, 0.01000506], [0.99990002, 1.2587614]]
      description: m_2, Mass
    - name: x3
      type: continuous
      train_range: [0.010006800653180244, 0.9975900075700807]
      ood_range: [[0.0079499136, 0.010006801], [0.99759001, 1.2556972]]
      description: r_2, Distance

  target:
    name: y
    type: continuous
    train_range: [-2.8248049146738142e-09, 4.232640933097793e-09]
    ood_range: 
    description: U, Potential energy

  license: CC BY 4.0
  citation:
    arXiv: 2206.10540
    title: Rethinking Symbolic Regression Datasets and Benchmarks for Scientific Discovery
  resources:
    - https://github.com/omron-sinicx/srsd-benchmark
    - https://huggingface.co/datasets/yoshitomo-matsubara/srsd-feynman_medium_dummy
