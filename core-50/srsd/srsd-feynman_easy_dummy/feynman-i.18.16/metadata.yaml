    train_range: [0.001050020451657474, 6.282364845275879]
    ood_range: [[0.0010500205, 0.0010500205], [6.2823648, 6.9104963]]
    description: theta, Angle
  - name: x5
    type: continuous
    train_range: [-9.991351065471906e+22, 9.996751782145048e+22]
    ood_range: [[-1.0990756e+23, -9.9913511e+22], [9.9967518e+22, 1.0996157e+23]]
