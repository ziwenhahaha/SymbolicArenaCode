dataset:
  name: srbench1.0__feynman__feynman_II_15_4
  description: Calculate the potential energy given the magnetic moment, magnetic
    field, and angle.
  splits:
    train:
      file: train.csv
      samples: 64000
      ratio: 8
      nmse: 3.973166976853394e-31
    valid:
      file: valid.csv
      samples: 8000
      ratio: 1
      nmse: 4.151954574957517e-31
    id_test:
      file: id_test.csv
      samples: 8000
      ratio: 1
      nmse: 3.896164716293016e-31
    ood_test:
      file: ood_test.csv
      samples: 10000
      ratio: 1.25
      nmse: 3.076595020196669e-29
  ground_truth_formula:
    file: formula.py
  features:
  - name: mom
    type: continuous
    train_range: [1.0000257, 4.9999887]
    ood_range: [[0.80002755, 1.0000257], [4.9999887, 5.1999869]]
    description: Magnetic moment
  - name: B
    type: continuous
    train_range: [1.0000051, 4.9999789]
    ood_range: [[0.80000645, 1.0000051], [4.9999789, 5.1999776]]
    description: Magnetic field
  - name: theta
    type: continuous
    train_range: [1.0000027, 4.9999481]
    ood_range: [[0.80000539, 1.0000027], [4.9999481, 5.1999453]]
    description: Angle
  target:
    name: target
    type: continuous
    train_range: [-12.185804701455456, 24.49625393247738]
    ood_range: [-18.526369364971647, -0.1886943680776833]
    description: Potential energy
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
