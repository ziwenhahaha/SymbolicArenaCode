dataset:
  name: srbench1.0__feynman__feynman_test_15
  description: Calculate the observed frequency given the speed of light, velocity,
    source frequency, and angle.
  splits:
    train:
      file: train.csv
      samples: 80000
      ratio: 8
      nmse: 2.340165438941076e-31
    valid:
      file: valid.csv
      samples: 10000
      ratio: 1
      nmse: 2.3563987912952735e-31
    id_test:
      file: id_test.csv
      samples: 10000
      ratio: 1
      nmse: 2.3609810137867517e-31
    ood_test:
      file: ood_test.csv
      samples: 10000
      ratio: 1
      nmse: 2.6797882945101806e-30
  ground_truth_formula:
    file: formula.py
  features:
  - name: c
    type: continuous
    train_range: [5.0000461, 19.999543]
    ood_range: [[4.2500712, 5.0000461], [19.999543, 20.749518]]
    description: Speed of light
  - name: v
    type: continuous
    train_range: [1.0001001, 2.9999991]
    ood_range: [[0.90010511, 1.0001001], [2.9999991, 3.0999941]]
    description: Velocity
  - name: omega
    type: continuous
    train_range: [1.0001644, 4.9999958]
    ood_range: [[0.80017286, 1.0001644], [4.9999958, 5.1999874]]
    description: Frequency
  - name: theta
    type: continuous
    train_range: [0.00026525924, 5.9999915]
    ood_range: [[0.00026525924, 0.00026525924], [5.9999915, 6.5999642]]
    description: Angle
  target:
    name: target
    type: continuous
    train_range: [0.6060438525253087, 9.359921807366714]
    ood_range: [0.3296004698202786, 4.978069501813607]
    description: Frequency
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
