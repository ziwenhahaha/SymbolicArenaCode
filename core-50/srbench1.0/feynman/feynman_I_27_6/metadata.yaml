dataset:
  name: srbench1.0__feynman__feynman_I_27_6
  description: Calculate the focal length given the object distance, image distance,
    and refractive index.
  splits:
    train:
      file: train.csv
      samples: 80000
      ratio: 8
      nmse: 1.3621402343596067e-31
    valid:
      file: valid.csv
      samples: 10000
      ratio: 1
      nmse: 1.3500148127092728e-31
    id_test:
      file: id_test.csv
      samples: 10000
      ratio: 1
      nmse: 1.4540619077849094e-31
    ood_test:
      file: ood_test.csv
      samples: 10000
      ratio: 1
      nmse: 2.330139269362727e-30
  ground_truth_formula:
    file: formula.py
  features:
  - name: d1
    type: continuous
    train_range: [1.0000531, 4.999983]
    ood_range: [[0.80005656, 1.0000531], [4.999983, 5.1999795]]
    description: Distance
  - name: d2
    type: continuous
    train_range: [1.0000163, 4.999982]
    ood_range: [[0.80001797, 1.0000163], [4.999982, 5.1999803]]
    description: Distance
  - name: n
    type: continuous
    train_range: [1.0000891, 4.9999957]
    ood_range: [[0.80009376, 1.0000891], [4.9999957, 5.1999911]]
    description: Refractive index
  target:
    name: target
    type: continuous
    train_range: [0.1739142187190154, 2.424607302792027]
    ood_range: [0.1305970632897912, 2.878386600424552]
    description: Focal length
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
