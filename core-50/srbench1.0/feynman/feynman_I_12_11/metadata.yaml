dataset:
  name: srbench1.0__feynman__feynman_I_12_11
  description: Calculate the force given the charge, electric field, magnetic field,
    velocity, and angle.
  splits:
    train:
      file: train.csv
      samples: 64000
      ratio: 8
      nmse: 1.441264449757212e-31
    valid:
      file: valid.csv
      samples: 8000
      ratio: 1
      nmse: 1.3028864056089923e-31
    id_test:
      file: id_test.csv
      samples: 8000
      ratio: 1
      nmse: 1.506248838006127e-31
    ood_test:
      file: ood_test.csv
      samples: 10000
      ratio: 1.25
      nmse: 6.41861539246859e-30
  ground_truth_formula:
    file: formula.py
  features:
  - name: q
    type: continuous
    train_range: [1.0000368, 4.9999797]
    ood_range: [[0.80003967, 1.0000368], [4.9999797, 5.1999769]]
    description: Charge
  - name: Ef
    type: continuous
    train_range: [1.0000551, 4.9999542]
    ood_range: [[0.80006011, 1.0000551], [4.9999542, 5.1999492]]
    description: Electric field
  - name: B
    type: continuous
    train_range: [1.0000735, 4.9999248]
    ood_range: [[0.80008093, 1.0000735], [4.9999248, 5.1999174]]
    description: Magnetic field
  - name: v
    type: continuous
    train_range: [1.0000287, 4.9998197]
    ood_range: [[0.80003911, 1.0000287], [4.9998197, 5.1998093]]
    description: Velocity
  - name: theta
    type: continuous
    train_range: [1.0000088, 4.9998951]
    ood_range: [[0.80001454, 1.0000088], [4.9998951, 5.1998894]]
    description: Angle
  target:
    name: target
    type: continuous
    train_range: [-106.6683216614737, 128.91803662176872]
    ood_range: [-127.60665206512722, 141.06355210283525]
    description: Lorentz force
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
