dataset:
  name: srbench1.0__strogatz__strogatz_predprey2
  description: This formula is about Predator dynamics based on prey availability.
    Calculate the Rate of change of predator population (dy/dt) given Prey population
    size and Predator population size
  splits:
    train:
      file: train.csv
      samples: 256
      ratio: 8
      nmse: 2.3314648053394296e-29
    valid:
      file: valid.csv
      samples: 32
      ratio: 1
      nmse: 4.015015271836819e-29
    id_test:
      file: id_test.csv
      samples: 32
      ratio: 1
      nmse: 1.9988427778155785e-29
    ood_test:
      file: ood_test.csv
      samples: 1000
      ratio: 31.25
      nmse: 0.0
  ground_truth_formula:
    file: formula.py
  features:
  - name: x
    type: continuous
    train_range: [0.0052500534904542, 6.58096270030409]
    ood_range: [[-0.3232297000224163, 0.0052500534904542], [6.58096270030409, 6.907968482869948]]
    description: Prey population size
  - name: y
    type: continuous
    train_range: [2.23997373694948, 11.6491125241285]
    ood_range: [[1.7628158308319657, 2.23997373694948], [11.6491125241285, 12.06662668142174]]
    description: Predator population size
  target:
    name: target
    type: continuous
    train_range: [-4.02898297009558, 1.82140800813115]
    ood_range: [-16.615584952315142, 1.572039697383209]
    description: Rate of change of predator population (dy/dt)
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
