dataset:
  name: srbench1.0__strogatz__strogatz_shearflow1
  description: This formula is about Polar orientation dynamics of a particle in shear
    flow. Calculate the Angular velocity of polar angle (dtheta/dt) given Polar angle
    of particle and Azimuthal angle of particle
  splits:
    train:
      file: train.csv
      samples: 256
      ratio: 8
      nmse: 4.0377678018086214e-29
    valid:
      file: valid.csv
      samples: 32
      ratio: 1
      nmse: 9.068398501036822e-30
    id_test:
      file: id_test.csv
      samples: 32
      ratio: 1
      nmse: 1.0714671617958117e-29
    ood_test:
      file: ood_test.csv
      samples: 1000
      ratio: 31.25
      nmse: 1.8658874377232934e-32
  ground_truth_formula:
    file: formula.py
  features:
  - name: x
    type: continuous
    train_range: [-4.35009524082152, 3.59982835587276]
    ood_range: [[-4.746049650604211, -4.35009524082152], [3.59982835587276, 3.997408085853374]]
    description: Polar angle of particle
  - name: y
    type: continuous
    train_range: [-2.7469888932939703, 2.14720535921647]
    ood_range: [[-2.994432285247646, -2.7469888932939703], [2.14720535921647, 2.3949105835147004]]
    description: Azimuthal angle of particle
  target:
    name: target
    type: continuous
    train_range: [-5.4332081711876, 2.40116500212969]
    ood_range: [-5.592490313703809, 0.9540995493102284]
    description: Angular velocity of polar angle (dtheta/dt)
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
