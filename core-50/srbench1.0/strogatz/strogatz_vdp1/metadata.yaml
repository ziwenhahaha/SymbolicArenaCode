dataset:
  name: srbench1.0__strogatz__strogatz_vdp1
  description: This formula is about Voltage dynamics in a self-oscillating circuit.
    Calculate the Rate of change of voltage (dx/dt) given Voltage and Current
  splits:
    train:
      file: train.csv
      samples: 256
      ratio: 8
      nmse: 2.468888303698774e-28
    valid:
      file: valid.csv
      samples: 32
      ratio: 1
      nmse: 3.83716600617057e-28
    id_test:
      file: id_test.csv
      samples: 32
      ratio: 1
      nmse: 1.3163484821726126e-28
    ood_test:
      file: ood_test.csv
      samples: 1000
      ratio: 31.25
      nmse: 1.7793335569149347e-32
  ground_truth_formula:
    file: formula.py
  features:
  - name: x
    type: continuous
    train_range: [-1.19091473098981, 1.9373743834906296]
    ood_range: [[-1.356286155286598, -1.19091473098981], [1.9373743834906296, 2.0964532514679366]]
    description: Voltage
  - name: y
    type: continuous
    train_range: [-0.196737957704796, 0.9276087313632232]
    ood_range: [[-0.2532307589153748, -0.196737957704796], [0.9276087313632232, 0.984209810799782]]
    description: Current
  target:
    name: target
    type: continuous
    train_range: [-8.73842144645423, 10.0298820788784]
    ood_range: [-26.15295192991214, 13.466895487269191]
    description: Rate of change of voltage (dx/dt)
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
