dataset:
  name: srbench1.0__strogatz__strogatz_barmag1
  description: This formula is about Coupled dynamics of the first magnetic dipole.
    Calculate the Angular velocity of the first magnet (dtheta/dt) given Angle of
    the first magnet and Angle of the second magnet
  splits:
    train:
      file: train.csv
      samples: 256
      ratio: 8
      nmse: 7.692964006641848e-29
    valid:
      file: valid.csv
      samples: 32
      ratio: 1
      nmse: 5.649188010360751e-29
    id_test:
      file: id_test.csv
      samples: 32
      ratio: 1
      nmse: 8.459408061685946e-29
    ood_test:
      file: ood_test.csv
      samples: 1000
      ratio: 31.25
      nmse: 0.0
  ground_truth_formula:
    file: formula.py
  features:
  - name: x
    type: continuous
    train_range: [4.1184890487447, 5.984944910392599]
    ood_range: [[4.026829827695094, 4.1184890487447], [5.984944910392599, 6.082665925480868]]
    description: Angle of the first magnet
  - name: y
    type: continuous
    train_range: [0.200011672644315, 6.6497768432110895]
    ood_range: [[-0.1224422942169441, 0.200011672644315], [6.6497768432110895, 6.97203531469151]]
    description: Angle of the second magnet
  target:
    name: target
    type: continuous
    train_range: [0.0131242281075332, 1.40189915942426]
    ood_range: [-0.1803120333428783, 0.6833395287530926]
    description: Angular velocity of the first magnet (dtheta/dt)
  license: GPL-3.0
  citation:
    arXiv: 2107.14351
    title: Contemporary Symbolic Regression Methods and their Relative Performance
  resources:
  - https://github.com/cavalab/srbench
  - https://cavalab.org/srbench/datasets/
