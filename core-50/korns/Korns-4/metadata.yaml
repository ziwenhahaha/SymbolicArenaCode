dataset:
  name: korns__Korns-4
  description: This is an abstract symbolic regression problem.
  splits:
    train:
      file: train.csv
      samples: 90
      ratio: 0.9
      nmse: 0
    valid:
      file: valid.csv
      samples: 10
      ratio: 0.1
      nmse: 0
    id_test:
      file: id_test.csv
      samples: 100
      ratio: 1
      nmse: 0
    ood_test:
      file: ood_test.csv
      samples: 1000
      ratio: 10
      nmse: 0
  ground_truth_formula:
    file: formula.py
  features:
  - name: x1
    type: continuous
    description: Independent variables (anonymized)
    train_range:
    - -47.67740799561639
    - 48.92141700073611
    ood_range:
    - -54.95328119276403
    - 54.957311068633345
  - name: x2
    type: continuous
    description: Independent variables (anonymized)
    train_range:
    - -49.963451787646264
    - 47.53300518142866
    ood_range:
    - -54.946383812158295
    - 54.95592916757425
  - name: x3
    type: continuous
    description: Independent variables (anonymized)
    train_range:
    - -48.08406785769249
    - 49.29833715966173
    ood_range:
    - -54.98441340664629
    - 54.969903211445015
  - name: x4
    type: continuous
    description: Independent variables (anonymized)
    train_range:
    - -49.81554639715059
    - 49.502630029595565
    ood_range:
    - -54.89900185592277
    - 54.93335206108837
  - name: x5
    type: continuous
