dataset:
  name: llm-srbench__chem_react__CRK33
  description: "Calculate Rate of change of concentration in chemistry reaction kinetics given Time and Concentration at time t"
  splits:
    train:
      file: train.csv
      samples: 3500
      ratio: 7
      nmse: inf
    valid:
      file: valid.csv
      samples: 500
      ratio: 1
      nmse: inf
    id_test:
      file: id_test.csv
      samples: 500
      ratio: 1
      nmse: inf
    ood_test:
      file: ood_test.csv
      samples: 500
      ratio: 1
      nmse: inf
  ground_truth_formula:
    file: formula.py
  features:
    - name: t
      type: continuous
      train_range: [0.0, 53.98679733276367]
      ood_range: [54.01080322265625, 60.0]
      description: Time
    - name: A
      type: continuous
      train_range: [1.0, 2.261096954345703]
      ood_range: [2.2585840225219727, 2.259649515151977]
      description: Concentration at time t
  target:
    name: dA_dt
    type: continuous
    train_range: [-0.0005849621957167, 0.3047294020652771]
    ood_range: [0.0001048723643179, 0.0006120954058133]
    description: Rate of change of concentration in chemistry reaction kinetics
  license: MIT
  citation:
    arXiv: 2504.10415
    title: 'LLM-SRBench: A New Benchmark for Scientific Equation Discovery with Large Language Models'
  resources:
    - https://github.com/deep-symbolic-mathematics/llm-srbench
    - https://huggingface.co/datasets/nnheui/llm-srbench
