dataset:
  name: llm-srbench__chem_react__CRK10
  description: "Calculate Rate of change of concentration in chemistry reaction kinetics given Time and Concentration at time t"
  splits:
    train:
      file: train.csv
      samples: 3500
      ratio: 7
      nmse: inf
    valid:
      file: valid.csv
      samples: 500
      ratio: 1
      nmse: inf
    id_test:
      file: id_test.csv
      samples: 500
      ratio: 1
      nmse: inf
    ood_test:
      file: ood_test.csv
      samples: 500
      ratio: 1
      nmse: inf
  ground_truth_formula:
    file: formula.py
  features:
    - name: t
      type: continuous
      train_range: [0.0, 53.99879837036133]
      ood_range: [54.01080322265625, 60.0]
      description: Time
    - name: A
      type: continuous
      train_range: [1.0, 1.6793736219406128]
      ood_range: [1.6774699687957764, 1.6781612634658811]
      description: Concentration at time t
  target:
    name: dA_dt
    type: continuous
    train_range: [-0.0005031007458455, 0.2028772979974746]
    ood_range: [6.120235775597394e-05, 0.0003826232568826]
    description: Rate of change of concentration in chemistry reaction kinetics
  license: MIT
  citation:
    arXiv: 2504.10415
    title: 'LLM-SRBench: A New Benchmark for Scientific Equation Discovery with Large Language Models'
  resources:
    - https://github.com/deep-symbolic-mathematics/llm-srbench
    - https://huggingface.co/datasets/nnheui/llm-srbench
