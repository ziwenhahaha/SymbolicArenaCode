dataset:
  name: llm-srbench__phys_osc__PO19
  description: "Calculate Acceleration in Non-linear Harmonic Oscillator given Position at time t, Time and Velocity at time t"
  splits:
    train:
      file: train.csv
      samples: 3500
      ratio: 7
      nmse: inf
    valid:
      file: valid.csv
      samples: 500
      ratio: 1
      nmse: inf
    id_test:
      file: id_test.csv
      samples: 500
      ratio: 1
      nmse: inf
    ood_test:
      file: ood_test.csv
      samples: 500
      ratio: 1
      nmse: inf
  ground_truth_formula:
    file: formula.py
  features:
    - name: x
      type: continuous
      train_range: [-0.410684734582901, 1.0]
      ood_range: [-1.0434689102112316e-05, 1.6713227523723617e-05]
      description: Position at time t
    - name: t
      type: continuous
      train_range: [0.0, 35.99919891357422]
      ood_range: [36.0072021484375, 40.0]
      description: Time
    - name: v
      type: continuous
      train_range: [-0.8600519895553588, 0.4488592445850372]
      ood_range: [-2.3881411834736355e-05, 1.442924258299172e-05]
      description: Velocity at time t
  target:
    name: dv_dt
    type: continuous
    train_range: [-1.0283058881759644, 0.8879510164260864]
    ood_range: [-3.849720815196633e-05, 3.153636498609558e-05]
    description: Acceleration in Non-linear Harmonic Oscillator
  license: MIT
  citation:
    arXiv: 2504.10415
    title: 'LLM-SRBench: A New Benchmark for Scientific Equation Discovery with Large Language Models'
  resources:
    - https://github.com/deep-symbolic-mathematics/llm-srbench
    - https://huggingface.co/datasets/nnheui/llm-srbench
