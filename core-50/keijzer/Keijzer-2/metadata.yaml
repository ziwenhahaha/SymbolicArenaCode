dataset:
  name: keijzer__Keijzer-2
  description: This is an abstract symbolic regression problem.
  splits:
    train:
      file: train.csv
      samples: 37
      ratio: 0.00924768807798
      nmse: 0
    valid:
      file: valid.csv
      samples: 4
      ratio: 0.000999750062484
      nmse: 0
    id_test:
      file: id_test.csv
      samples: 4001
      ratio: 1
      nmse: 0
    ood_test:
      file: ood_test.csv
      samples: 410
      ratio: 0.102474381405
      nmse: 0
  ground_truth_formula:
    file: formula.py
  features:
  - name: x1
    type: continuous
    description: Independent variables (anonymized)
    train_range:
    - -2.0
    - 2.0
    ood_range:
    - -2.1993437243982386
    - 2.1979298573735417
  target:
    name: target
    type: continuous
    description: Dependent variable (target)
    train_range:
    - -0.5135705187993831
    - 0.3709120413551101
    ood_range:
    - 0.0005742209328064587
    - 0.6266639795149701
  license: unknown
  resources:
  - https://github.com/dso-org/deep-symbolic-optimization
  - https://raw.githubusercontent.com/dso-org/deep-symbolic-optimization/master/dso/dso/dso/task/regression/benchmarks.csv
  - 'Benchmark family: keijzer'
  - 'Equation: 0.3*x1*sin(2*pi*x1)'
  - 'Train specification: {''all'': {''E'': [-2, 2, 0.1]}}'
  - 'Test specification: {''all'': {''E'': [-2, 2, 0.001]}}'
  - The external benchmark test specification is same-domain and was mapped to id_test.
  - OOD split was synthesized from the training domain by sampling at least one feature
    outside the train range and evaluating the ground-truth formula.
